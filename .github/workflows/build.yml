name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    env:
      # убедимся, что ~/.local/bin доступен в PATH для всех шагов
      PATH: ${{ github.workspace }}:${{ env.PATH }}:${HOME}/.local/bin
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install apt dependencies
        run: |
          sudo apt update
          sudo apt install -y git build-essential openjdk-17-jdk zip unzip zlib1g-dev \
            libncurses6 libncurses-dev libstdc++6 libffi-dev libssl-dev python3-venv python3-pip
        # Примечание: в Ubuntu 24.04 libncurses5 может отсутствовать, поэтому используем libncurses6/libncurses-dev

      - name: Install buildozer & cython (user)
        run: |
          python -m pip install --upgrade pip
          python -m pip install --user buildozer cython
        # ~/.local/bin должен быть в PATH (сверху мы добавили его в env)

      - name: Ensure ~/.local/bin is in PATH for this step
        run: |
          echo "PATH before: $PATH"
          export PATH=$PATH:~/.local/bin
          echo "PATH after: $PATH"
        shell: bash

      - name: Initialize buildozer.spec if missing
        run: |
          # если buildozer.spec отсутствует, создадим шаблон (не перезаписываем существующий)
          if [ ! -f buildozer.spec ]; then
            buildozer init || true
          fi

      - name: Build debug APK with Buildozer
        env:
          # временная переменная для Android SDK локации (если потребуется)
          ANDROIDSDK: ${{ runner.temp }}/android-sdk
        run: |
          # убедимся, что используем ~/.local/bin
          export PATH=$PATH:~/.local/bin
          # Запуск сборки (первый запуск загрузит SDK/NDK и займет время)
          buildozer -v android debug
        shell: bash

      - name: List bin directory (for debugging)
        run: |
          echo "Contents of project bin/ directory:"
          ls -la bin || true

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: bin/*.apk