name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install apt dependencies
        run: |
          sudo apt update
          sudo apt install -y git build-essential openjdk-17-jdk zip unzip zlib1g-dev \
            libncurses6 libncurses-dev libstdc++6 libffi-dev libssl-dev python3-venv python3-pip wget

      - name: Prepare Android SDK and install build-tools (36.1.0)
        run: |
          set -euo pipefail

          # Путь куда установим SDK (в HOME, чтобы Buildozer мог к нему иметь доступ)
          SDKROOT="${HOME}/android-sdk"
          echo "SDKROOT=${SDKROOT}"
          rm -rf "${SDKROOT}"
          mkdir -p "${SDKROOT}"
          cd "${SDKROOT}"

          # Скачиваем commandline tools (две попытки по возможным URL)
          CMDLINE_ZIP=commandlinetools-linux-latest.zip
          wget -q -O ${CMDLINE_ZIP} https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip || \
            wget -q -O ${CMDLINE_ZIP} https://dl.google.com/android/repository/commandlinetools-linux-8512546_latest.zip || \
            (echo "Failed to download commandlinetools zip; please update URL" && exit 1)

          mkdir -p cmdline-tools
          unzip -q ${CMDLINE_ZIP} -d cmdline-tools
          # Нормализуем структуру в cmdline-tools/latest
          if [ -d cmdline-tools/cmdline-tools ]; then
            mv cmdline-tools/cmdline-tools cmdline-tools/latest
          else
            mv cmdline-tools/* cmdline-tools/latest || true
          fi
          rm -f ${CMDLINE_ZIP}

          # Обновим PATH временно
          export PATH="${SDKROOT}/cmdline-tools/latest/bin:${SDKROOT}/platform-tools:${PATH}"

          # Создаём конфиги
          mkdir -p "${HOME}/.android"
          touch "${HOME}/.android/repositories.cfg" || true

          # Установим требуемые компоненты (platform-tools, platform 36 и build-tools 36.1.0)
          echo "Installing platform-tools, platforms;android-36 and build-tools;36.1.0"
          yes | "${SDKROOT}/cmdline-tools/latest/bin/sdkmanager" --sdk_root="${SDKROOT}" "platform-tools" "platforms;android-36" "build-tools;36.1.0" || true

          # Принять лицензии неинтерактивно
          yes | "${SDKROOT}/cmdline-tools/latest/bin/sdkmanager" --sdk_root="${SDKROOT}" --licenses || true

          # Сохраняем переменные окружения для следующих шагов
          echo "ANDROID_SDK_ROOT=${SDKROOT}" >> $GITHUB_ENV
          echo "ANDROID_HOME=${SDKROOT}" >> $GITHUB_ENV
          echo "PATH=${SDKROOT}/cmdline-tools/latest/bin:${SDKROOT}/platform-tools:$HOME/.local/bin:${PATH}" >> $GITHUB_ENV
          echo "JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64" >> $GITHUB_ENV

          # Подготовим путь, где Buildozer ожидает SDK, и сделаем симлинк
          mkdir -p "${HOME}/.buildozer/android/platform"
          # удалим старый если есть
          if [ -L "${HOME}/.buildozer/android/platform/android-sdk" ] || [ -d "${HOME}/.buildozer/android/platform/android-sdk" ]; then
            rm -rf "${HOME}/.buildozer/android/platform/android-sdk"
          fi
          ln -s "${SDKROOT}" "${HOME}/.buildozer/android/platform/android-sdk"
          echo "Linked ${SDKROOT} -> ${HOME}/.buildozer/android/platform/android-sdk"

          # Диагностика: покажем, что установлено
          echo "=== sdkmanager --list ==="
          "${SDKROOT}/cmdline-tools/latest/bin/sdkmanager" --sdk_root="${SDKROOT}" --list || true

      - name: Install buildozer & cython (user)
        run: |
          python -m pip install --upgrade pip
          python -m pip install --user buildozer cython

      - name: Ensure ~/.local/bin is in PATH
        run: echo "PATH=$HOME/.local/bin:$PATH" >> $GITHUB_ENV

      - name: Initialize buildozer.spec if missing
        run: |
          if [ ! -f buildozer.spec ]; then
            buildozer init || true
          fi

      - name: Show environment (diagnostics)
        run: |
          echo "JAVA_HOME=$JAVA_HOME"
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          echo "PATH=$PATH"
          which sdkmanager || true
          sdkmanager --version || true
        shell: bash

      - name: Build debug APK with Buildozer
        run: |
          set -euo pipefail
          # Убедимся, что buildozer доступен
          export PATH=$HOME/.local/bin:$PATH
          echo "Running buildozer -v android debug (this may take long on first run)"
          buildozer -v android debug
        shell: bash
        timeout-minutes: 120

      - name: List bin directory (for debugging)
        run: |
          echo "Contents of project bin/ directory:"
          ls -la bin || true

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: bin/*.apk
