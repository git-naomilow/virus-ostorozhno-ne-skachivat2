name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install apt dependencies
        run: |
          sudo apt update
          sudo apt install -y git build-essential openjdk-17-jdk zip unzip zlib1g-dev \
            libncurses6 libncurses-dev libstdc++6 libffi-dev libssl-dev python3-venv python3-pip wget

      - name: Prepare Android SDK (cmdline-tools) and accept licenses (install build-tools 36.1)
        run: |
          set -euo pipefail
          SDKROOT="${RUNNER_TEMP}/android-sdk"
          mkdir -p "${SDKROOT}"
          cd "${SDKROOT}"
          echo "Preparing Android SDK at ${SDKROOT}"

          # download commandline tools (if link breaks, replace with current URL from Android site)
          CMDLINE_ZIP=commandlinetools-linux-latest.zip
          wget -q -O ${CMDLINE_ZIP} https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip || \
            wget -q -O ${CMDLINE_ZIP} https://dl.google.com/android/repository/commandlinetools-linux-8512546_latest.zip

          mkdir -p cmdline-tools
          unzip -q ${CMDLINE_ZIP} -d cmdline-tools
          if [ -d cmdline-tools/cmdline-tools ]; then
            mv cmdline-tools/cmdline-tools cmdline-tools/latest
          else
            mv cmdline-tools/* cmdline-tools/latest || true
          fi
          rm -f ${CMDLINE_ZIP}

          # set temporary PATH for sdkmanager
          export PATH="${SDKROOT}/cmdline-tools/latest/bin:${SDKROOT}/platform-tools:${PATH}"

          # ensure android config file
          mkdir -p ${HOME}/.android
          touch ${HOME}/.android/repositories.cfg || true

          # Install platform-tools, desired platform and build-tools (explicitly install 36.1.0)
          echo "Installing platform-tools, platforms;android-36 and build-tools;36.1.0"
          yes | "${SDKROOT}/cmdline-tools/latest/bin/sdkmanager" --sdk_root="${SDKROOT}" "platform-tools" "platforms;android-36" "build-tools;36.1.0" || true

          # Accept all licenses non-interactively
          yes | "${SDKROOT}/cmdline-tools/latest/bin/sdkmanager" --sdk_root="${SDKROOT}" --licenses || true

          # Export env for following steps
          echo "ANDROID_SDK_ROOT=${SDKROOT}" >> $GITHUB_ENV
          echo "ANDROID_HOME=${SDKROOT}" >> $GITHUB_ENV
          # Add cmdline-tools and platform-tools and ~/.local/bin to PATH for following steps
          echo "PATH=$PATH:${SDKROOT}/cmdline-tools/latest/bin:${SDKROOT}/platform-tools:$HOME/.local/bin" >> $GITHUB_ENV
          # Set JAVA_HOME
          echo "JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64" >> $GITHUB_ENV

          echo "SDK prepared. Listing installed packages (sdkmanager --list):"
          "${SDKROOT}/cmdline-tools/latest/bin/sdkmanager" --sdk_root="${SDKROOT}" --list || true

      - name: Install buildozer & cython (user)
        run: |
          python -m pip install --upgrade pip
          python -m pip install --user buildozer cython
      - name: Ensure ~/.local/bin is in PATH for the rest of the job
        run: |
          echo "PATH=$PATH:$HOME/.local/bin" >> $GITHUB_ENV

      - name: Initialize buildozer.spec if missing
        run: |
          if [ ! -f buildozer.spec ]; then
            buildozer init || true
          fi

      - name: Show environment (diagnostics)
        run: |
          echo "JAVA_HOME=$JAVA_HOME"
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          echo "PATH=$PATH"
          which sdkmanager || true
          sdkmanager --version || true
        shell: bash

      - name: Build debug APK with Buildozer
        run: |
          set -e
          # ensure user-local bin is available
          export PATH=$PATH:$HOME/.local/bin
          echo "Running buildozer (this may take long on first run)..."
          buildozer -v android debug
        shell: bash

      - name: List bin directory (for debugging)
        run: |
          echo "Contents of project bin/ directory:"
          ls -la bin || true

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: bin/*.apk
