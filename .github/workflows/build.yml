name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install apt dependencies
        run: |
          sudo apt update
          sudo apt install -y git build-essential openjdk-17-jdk zip unzip zlib1g-dev \
            libncurses6 libncurses-dev libstdc++6 libffi-dev libssl-dev python3-venv python3-pip wget

      - name: Prepare Android SDK (cmdline-tools) and accept licenses
        run: |
          set -e
          # Используем стандартную CI-переменную RUNNER_TEMP для временной директории
          SDKROOT="${RUNNER_TEMP}/android-sdk"
          mkdir -p "${SDKROOT}"
          cd "${SDKROOT}"
          echo "Preparing Android SDK at ${SDKROOT}"
          # Скачиваем commandline tools (URL может меняться; при проблемах подставь актуальную ссылку)
          CMDLINE_ZIP=commandlinetools-linux-latest.zip
          wget -q -O ${CMDLINE_ZIP} https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip || \
            wget -q -O ${CMDLINE_ZIP} https://dl.google.com/android/repository/commandlinetools-linux-8512546_latest.zip
          mkdir -p cmdline-tools
          unzip -q ${CMDLINE_ZIP} -d cmdline-tools
          # Нормализуем структуру папок: mv cmdline-tools/cmdline-tools -> cmdline-tools/latest
          if [ -d cmdline-tools/cmdline-tools ]; then
            mv cmdline-tools/cmdline-tools cmdline-tools/latest
          else
            # если структура иная — переместим всё в latest
            mv cmdline-tools/* cmdline-tools/latest || true
          fi
          rm -f ${CMDLINE_ZIP}
          # Обновим PATH временно для sdkmanager
          export PATH="${SDKROOT}/cmdline-tools/latest/bin:${SDKROOT}/platform-tools:${PATH}"
          # Создаём файл repositories.cfg, чтобы sdkmanager не жаловался
          mkdir -p ${HOME}/.android
          touch ${HOME}/.android/repositories.cfg || true
          # Установим платформу и build-tools (версию можно менять при необходимости)
          echo "y" | "${SDKROOT}/cmdline-tools/latest/bin/sdkmanager" --sdk_root="${SDKROOT}" "platform-tools" "platforms;android-33" "build-tools;33.0.2" || true
          # Автоматическое принятие лицензий
          yes | "${SDKROOT}/cmdline-tools/latest/bin/sdkmanager" --sdk_root="${SDKROOT}" --licenses || true
          # Сохраним пути для следующих шагов (через GITHUB_ENV)
          echo "ANDROID_SDK_ROOT=${SDKROOT}" >> $GITHUB_ENV
          echo "ANDROID_HOME=${SDKROOT}" >> $GITHUB_ENV
          # Добавим инструменты в PATH для следующих шагов
          echo "PATH=$PATH:${SDKROOT}/cmdline-tools/latest/bin:${SDKROOT}/platform-tools:$HOME/.local/bin" >> $GITHUB_ENV
          # Установим JAVA_HOME (используем системный OpenJDK)
          echo "JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64" >> $GITHUB_ENV
          echo "Android SDK prepared. sdkmanager version:"
          "${SDKROOT}/cmdline-tools/latest/bin/sdkmanager" --version || true

      - name: Install buildozer & cython (user)
        run: |
          python -m pip install --upgrade pip
          python -m pip install --user buildozer cython
        # ~/.local/bin будет добавлен в PATH через предыдущий шаг (GITHUB_ENV)

      - name: Initialize buildozer.spec if missing
        run: |
          if [ ! -f buildozer.spec ]; then
            buildozer init || true
          fi

      - name: Build debug APK with Buildozer
        run: |
          # Гарантируем, что PATH и переменные окружения настроены (они попали в $GITHUB_ENV)
          echo "JAVA_HOME=$JAVA_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          echo "Using PATH: $PATH"
          # Покажем sdkmanager для диагностики
          which sdkmanager || true
          sdkmanager --list || true
          # Запускаем сборку (может занять долго — скачивание/компиляция)
          buildozer -v android debug
        shell: bash

      - name: List bin directory (for debugging)
        run: |
          echo "Contents of project bin/ directory:"
          ls -la bin || true

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: bin/*.apk
