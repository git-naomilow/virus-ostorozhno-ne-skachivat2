name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install apt dependencies
        run: |
          sudo apt update
          sudo apt install -y git build-essential openjdk-17-jdk zip unzip zlib1g-dev \
            libncurses6 libncurses-dev libstdc++6 libffi-dev libssl-dev python3-venv python3-pip

      - name: Install buildozer & cython (user)
        run: |
          python -m pip install --upgrade pip
          python -m pip install --user buildozer cython
        # не полагаемся на job-level env; добавим ~/.local/bin в PATH в следующих шагах

      - name: Ensure ~/.local/bin is in PATH for following steps
        run: |
          echo "Adding ~/.local/bin to PATH for this environment"
          echo "PATH=$PATH:$HOME/.local/bin" >> $GITHUB_ENV

      - name: Initialize buildozer.spec if missing
        run: |
          if [ ! -f buildozer.spec ]; then
            buildozer init || true
          fi

      - name: Build debug APK with Buildozer
        env:
          # временная переменная (опционально)
          ANDROIDSDK: ${{ runner.temp }}/android-sdk
        run: |
          # ~/.local/bin уже добавлен в PATH через $GITHUB_ENV
          echo "Using PATH: $PATH"
          buildozer -v android debug
        shell: bash

      - name: List bin directory (for debugging)
        run: |
          echo "Contents of project bin/ directory:"
          ls -la bin || true

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: bin/*.apk
